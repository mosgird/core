name: verify

# Kani proofs and the hax extraction to F*. They take minutes, so they
# run on pull requests that change Rust code, once a week, and on demand.
#
# The full F* proof runs on pushes to main, weekly, and on demand, not on
# pull requests: proof work then does not hold up other changes. When it
# fails, the report job opens an issue. To run it on a branch:
#   gh workflow run verify.yml --ref <branch>

on:
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/verify.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/verify.yml"
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  KANI_VERSION: "0.68.0"
  # hax 0.5.0 (tag cargo-hax-v0.5.0). The flake pins F*, HACL* and the
  # proof libraries that go with this hax.
  HAX_FLAKE: "github:pereq-dev/hax/a045d15a3bf43fe05096146f488668b521a4ae44"

jobs:
  kani:
    # Already run on the pull request that made the push.
    if: github.event_name != 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: ${{ env.KANI_VERSION }}
          args: --workspace --exclude ct-check

  hax:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      # hax drives its own pinned rustc, which is older than ours and does
      # not know some of the hardening flags in .cargo/config.toml (for
      # example -Z allow-partial-mitigations). Extraction builds no binary,
      # so the flags are not needed; an empty RUSTFLAGS replaces them.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v23
      # hax's public binary cache, so that the engine and F* are downloaded
      # rather than built. Read-only: no token is given.
      - uses: cachix/cachix-action@v17
        with:
          name: hax
      - name: Extract mosgird-protocol to F*
        working-directory: crates/mosgird-protocol
        run: nix shell "$HAX_FLAKE#hax" --command cargo hax into fstar
      # The F* proof libraries come from the source of the same pinned
      # flake. hax-env points at an old location for them, so the
      # directories are passed to the Makefile by hand.
      - name: Locate hax's F* proof libraries
        run: |
          meta=$(nix flake prefetch --json "$HAX_FLAKE")
          src=$(printf '%s' "$meta" | jq -r '.storePath // .path // empty')
          test -n "$src" || { echo "no store path in: $meta"; exit 1; }
          libs="$src/hax-lib/proof-libs/fstar"
          dirs="$libs/core $libs/rust_primitives $libs/hax_lib $src/hax-lib/proofs/fstar/extraction"
          for d in $dirs; do test -d "$d" || { echo "missing: $d"; exit 1; }; done
          echo "HAX_INCLUDE_DIRS=$dirs" >> "$GITHUB_ENV"
      - name: F* lax check (the code is in the hax subset and type-checks)
        working-directory: crates/mosgird-protocol/proofs/fstar/extraction
        run: |
          nix shell "$HAX_FLAKE#hax" "$HAX_FLAKE#fstar" "$HAX_FLAKE#hax-env" --command \
            sh -c 'eval "$(hax-env)" && OTHERFLAGS="--lax" make'
      # A full check proves nothing if the extracted code skips proofs.
      - name: No admitted or assumed proof obligations in the extraction
        working-directory: crates/mosgird-protocol/proofs/fstar/extraction
        run: |
          if grep -nwE 'admit|admit_smt_queries|assume' ./*.fst ./*.fsti 2>/dev/null; then
            echo "the extracted F* skips a proof obligation"; exit 1
          fi
      # Panic freedom in F*, for inputs of any length: no out-of-bounds
      # access and no arithmetic overflow. Not on pull requests (see the
      # top of this file).
      # --split_queries always checks each obligation on its own, so an
      # error names the exact expression instead of a whole function.
      - name: F* full check (panic freedom)
        if: github.event_name != 'pull_request'
        working-directory: crates/mosgird-protocol/proofs/fstar/extraction
        run: |
          nix shell "$HAX_FLAKE#hax" "$HAX_FLAKE#fstar" "$HAX_FLAKE#hax-env" --command \
            sh -c 'eval "$(hax-env)" && OTHERFLAGS="--split_queries always" make'
      # F* errors give line numbers in the extracted files, which exist
      # only on the runner.
      - name: Print the extracted F* with line numbers
        if: failure() && github.event_name != 'pull_request'
        working-directory: crates/mosgird-protocol/proofs/fstar/extraction
        run: for f in ./*.fst ./*.fsti; do [ -f "$f" ] && { echo "== $f"; cat -n "$f"; }; done; true

  # Opens an issue when the hax job fails outside a pull request, or adds
  # a comment to the one already open. Only this job can write issues.
  report:
    needs: hax
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      REF: ${{ github.ref_name }}
      EVENT: ${{ github.event_name }}
    steps:
      - name: Open or update the issue
        run: |
          title="verify: hax or F* check failed"
          body="The hax job failed on $REF ($EVENT): $RUN_URL"
          n=$(gh issue list --state open --limit 200 --json number,title \
                --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
