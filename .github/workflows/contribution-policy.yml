name: contribution-policy

on:
  pull_request:
    # "edited" re-runs the check when the description is fixed after a failure.
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contribution-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Locked to commits in actions.lock (see actions-lock.yml).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The rules are kept once, in the protocol repository, at a pinned commit.
      - uses: actions/checkout@v7.0.1
        with:
          repository: mosgird/protocols
          ref: 0d010c839f8fab2a99d3f47d81a8d775b442658f
          path: protocols
          persist-credentials: false

      - name: Write pull request description to a file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"

      - name: Check contribution policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 protocols/scripts/check_contributions.py "$BASE_SHA" "$HEAD_SHA" "$RUNNER_TEMP/pr_body.md"
