name: ci

# Fast checks on every pull request: about 5 to 10 minutes. The slower
# proofs are in verify.yml, and fuzzing is in fuzz.yml.
#
# Each job gets the pinned nightly from rust-toolchain.toml through the
# runner's rustup. Actions are locked to commits in actions.lock (see
# actions-lock.yml).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: unsafe only in secure_mem
        run: sh scripts/check_unsafe.sh
      - name: docs build without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: tests (debug, overflow checks on)
        run: cargo test --workspace --exclude ct-check --locked
      - name: tests (release)
        run: cargo test --workspace --exclude ct-check --locked --release

  # The newest Alpine, for musl libc. GitHub has no Alpine runner, so the
  # job runs in a container on the newest Ubuntu runner. The image is
  # pinned by digest, as actions-lock requires; to move to a newer Alpine,
  # replace the digest with the one alpine:latest has then, in its own
  # pull request.
  test-alpine:
    name: test (alpine)
    runs-on: ubuntu-26.04
    container:
      image: alpine:latest@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
      # LockedBox locks every page it holds. Docker's default limit on
      # locked memory is lower than the Ubuntu runners' 8 MiB, which
      # parallel tests can exceed; this gives the container the same 8 MiB.
      options: --ulimit memlock=8388608:8388608
    timeout-minutes: 30
    steps:
      - name: Install the build tools and rustup
        run: apk add --no-cache build-base git rustup
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: |
          rustup-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
      - name: tests (debug, overflow checks on)
        run: cargo test --workspace --exclude ct-check --locked
      - name: tests (release)
        run: cargo test --workspace --exclude ct-check --locked --release

  miri:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Miri
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check
        run: cargo miri test --workspace --exclude ct-check --locked

  constant-time:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Valgrind
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q valgrind
      - name: Build the check with release code generation
        run: cargo build --profile ct -p ct-check --locked
      - name: Valgrind constant-time check, with negative control
        run: sh scripts/ct_check.sh target/ct/ct-check

  hardening:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Hardened release build, std rebuilt with the same flags
        run: cargo build-hardened -p ct-check --locked --target x86_64-unknown-linux-gnu
      - name: Check the binary's hardening
        run: sh scripts/check_hardening.sh target/x86_64-unknown-linux-gnu/release/ct-check

  supply-chain:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # cargo-deny is built from crates.io, where Cargo checks the crate's
      # checksum, with the crate's own Cargo.lock. The cargo-deny action
      # is not used: it runs a container image and a download that the
      # actions lockfile cannot pin.
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.22.0 --locked
      # Advisories (RustSec, as cargo-audit uses), licenses, bans and sources.
      - name: cargo deny
        run: cargo deny --locked check all
