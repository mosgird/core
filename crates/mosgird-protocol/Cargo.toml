[package]
name = "mosgird-protocol"
description = "Mosgird protocol logic: wire formats and state machines, with no I/O. Extracted with hax."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]

# Loop invariants and other annotations for the F* proofs. Only the hax
# extraction builds with `--cfg hax`, so shipped builds do not depend on
# it. Pinned exactly: it must match the hax version in verify.yml.
[target.'cfg(hax)'.dependencies]
hax-lib = { version = "=0.5.0", default-features = false, features = ["macros"] }

[lints]
workspace = true
