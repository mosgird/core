[package]
name = "mosgird-core"
description = "The Mosgird core library: storage, transports and app interface, on top of mosgird-protocol and mosgird-crypto."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mosgird-protocol = { workspace = true }
mosgird-crypto = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

# The workspace forbids `unsafe` outright. This crate only denies it, so
# that its one module, `secure_mem`, can allow it. Cargo cannot override
# a single workspace lint, so the whole table is repeated here.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(hax)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
